set -g default-terminal "$TERM"
set -ag terminal-overrides ",$TERM:Tc"
set -g focus-events on
set -g default-shell /opt/homebrew/bin/fish
set -g allow-passthrough on
set-option -g status-position top

set -g prefix C-s
unbind C-b
bind-key C-s send-prefix
set -s set-clipboard on

unbind %
bind / split-window -h 

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf

bind -r m resize-pane -Z

bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r H resize-pane -L 5
bind-key -r L resize-pane -R 5

bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

setw -g mode-keys vi
setw -g monitor-activity on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"

# enable copy to clipboard (set-clipboard on handles this natively)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @plugin 'catppuccin/tmux#v2.3.0'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Configure catppuccin (v2)
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "basic"
# Agent windows show "<icon> <agent>: <topic>" (see agent block below), others the window name
set -g @catppuccin_window_text " #{?@agent,#{E:@agent_label},#W}"
set -g @catppuccin_window_current_text " #{?@agent,#{E:@agent_label},#W}"

# Agent state colours the window-number block (set by ~/.local/bin/agent-tmux-status)
# red = needs you / error, green = done & unseen, yellow = working, peach = interrupted
set -g @catppuccin_window_number_color "#{?#{m/r:^(waiting|error)$,#{@agent}},#{@thm_red},#{?#{==:#{@agent},done},#{@thm_green},#{?#{==:#{@agent},working},#{@thm_yellow},#{?#{==:#{@agent},interrupted},#{@thm_peach},#{@thm_overlay_2}}}}}"

# Topic = the title the agent gives its pane, minus spinner and Codex's " | project" suffix.
# Generic titles fall back to the last prompt, then the directory name.
set -g @agent_topic_raw "#{s/^[^a-zA-Z0-9]+ //:#{s/ [|] .*$//:#{@agent_title}}}"
set -g @agent_topic "#{?#{m/r:^(Claude Code|Codex|claude|codex)?$,#{E:@agent_topic_raw}},#{?@agent_prompt,#{@agent_prompt},#{@agent_name}},#{E:@agent_topic_raw}}"
set -g @agent_label "#{?@agent_icon,#{@agent_icon} ,}#{@agent_kind}: #{=/30/…:#{E:@agent_topic}}"

# Keep the topic live as the agent retitles its pane (pure tmux, no fork per spinner frame)
set-hook -g pane-title-changed[42] 'set -wF @agent_title "#{?#{==:#{pane_id},#{@agent_pane}},#{pane_title},#{@agent_title}}"'

# Visiting a window marks its finished agent as seen (✓ -> bare name)
set-hook -g session-window-changed[42] 'run-shell -b "$HOME/.local/bin/agent-tmux-status seen #{window_id}"'
set-hook -g client-session-changed[42] 'run-shell -b "$HOME/.local/bin/agent-tmux-status seen #{window_id}"'
set-hook -g pane-focus-in[42] 'run-shell -b "$HOME/.local/bin/agent-tmux-status seen #{window_id}"'

# Separator styling
set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_connect_separator "yes"

# Custom module icons
set -g @catppuccin_host_icon " 󰒋 "
set -g @catppuccin_session_icon "  "

# Initialize TMUX plugin manager (loads catppuccin)
run '~/.tmux/plugins/tpm/tpm'

# Status bar (must be set AFTER catppuccin loads)
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_host}"
set -ag status-right "#{E:@catppuccin_status_session}"

# Remove gaps between window tabs
set -g window-status-separator ""
