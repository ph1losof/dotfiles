set -g default-terminal "$TERM"
set -ag terminal-overrides ",$TERM:Tc"
set -g focus-events on
set -g default-shell /opt/homebrew/bin/fish
set -g allow-passthrough on
set-option -g status-position top

set -g prefix C-s
unbind C-b
bind-key C-s send-prefix
set -s set-clipboard on

unbind %
bind / split-window -h 

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf

bind -r m resize-pane -Z

bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r H resize-pane -L 5
bind-key -r L resize-pane -R 5

bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

setw -g mode-keys vi
# No activity alerts: agents stream output constantly, and with visual-activity off
# every alert rang the terminal bell. agent-tmux-status rings on real events instead.
setw -g monitor-activity off

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"

# enable copy to clipboard (set-clipboard on handles this natively)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @plugin 'catppuccin/tmux#v2.3.0'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Configure catppuccin (v2)
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "basic"
# ---- Coding agents (state from ~/.local/bin/agent-tmux-status via Claude/Codex hooks) ----
# An agent counts only while its pane still runs it: once that pane is back at a
# shell or gone (crash, kill), the window is treated as a plain one again.
set -g @agent_alive "#{?#{m/r:^(-?(fish|zsh|bash|sh))?$,#{P:#{?#{==:#{pane_id},#{@agent_pane}},#{pane_current_command},}}},0,1}"
set -g @agent_on "#{?@agent,#{E:@agent_alive},0}"

# Agent icon per @agent_kind (no Claude/OpenAI logos in Nerd Fonts): ✳ is Claude Code's own title mark
set -g @agent_kind_icon_claude "✳"
set -g @agent_kind_icon_codex "󰚩"
set -g @agent_kind_icon "#{?#{==:#{@agent_kind},claude},#{@agent_kind_icon_claude},#{?#{==:#{@agent_kind},codex},#{@agent_kind_icon_codex},󰚩}}"

# Tab width follows the room there is: (client width - ~30 for status-right) split
# across the session's windows, minus ~8 for the number block and padding, clamped
# to 0..12 characters of text. Many windows shrink tabs to number + colour + icon.
set -g @tab_room "#{e|-:#{e|/:#{e|-:#{client_width},30},#{session_windows}},8}"
set -g @tab_room_c "#{?#{e|<:#{E:@tab_room},1},0,#{?#{e|>:#{E:@tab_room},12},12,#{E:@tab_room}}}"
set -g @tab_room_cur "#{?#{e|>:#{e|+:#{e|*:#{E:@tab_room_c},2},6},24},24,#{e|+:#{e|*:#{E:@tab_room_c},2},6}}"

# Every agent tab reads the same, focused or not: agent icon + what it is doing.
# Colour alone carries the state; the current tab is bold and gets more room.
# prefix + a lists every agent with its branch and full task.
set -g @agent_tab "#{E:@agent_kind_icon}#{?@agent_task, #{=/#{E:@tab_room_c}/…:#{@agent_task}},}"
set -g @agent_tab_cur "#{E:@agent_kind_icon}#{?@agent_task, #{=/#{E:@tab_room_cur}/…:#{@agent_task}},}"
set -g @agent_overview "#{?@agent_icon,#{@agent_icon},·} #{E:@agent_kind_icon} #{@agent_task_full}#{?@agent_branch,  (#{@agent_branch}),}"
set -g @catppuccin_window_text " #{?#{E:@agent_on},#{E:@agent_tab},#{=/#{e|+:#{E:@tab_room_c},2}/…:window_name}}"
set -g @catppuccin_window_current_text " #[bold]#{?#{E:@agent_on},#{E:@agent_tab_cur},#{=/#{E:@tab_room_cur}/…:window_name}}#[nobold]"

# Window-number colour is the state: yellow = working (itself or its subagents),
# red = needs you, green = done and not seen yet. Idle or no agent: grey, or
# mauve when current.
set -g @agent_state_color "#{?#{==:#{@agent},waiting},#{@thm_red},#{?#{==:#{@agent},done},#{@thm_green},#{?#{==:#{@agent},working},#{@thm_yellow},}}}"
set -g @catppuccin_window_number_color "#{?#{&&:#{E:@agent_on},#{E:@agent_state_color}},#{E:@agent_state_color},#{@thm_overlay_2}}"
set -g @catppuccin_window_current_number_color "#{?#{&&:#{E:@agent_on},#{E:@agent_state_color}},#{E:@agent_state_color},#{@thm_mauve}}"

# prefix + a: every live agent with its full task and a live preview of its pane
bind a choose-tree -Zw -f "#{E:@agent_on}" -F "#{E:@agent_overview}"
# prefix + Tab: jump to the agent that most needs you (red first, then the oldest green)
bind Tab run-shell "$HOME/.local/bin/agent-tmux-status next '#{client_name}'"

# Re-derive the task when an agent's title text changes. The key drops the first
# token, so spinner frames (which change only that) never fork a process.
set-hook -g pane-title-changed[42] {
  if -F "#{&&:#{==:#{pane_id},#{@agent_pane}},#{!=:#{s/^[^ ]* //:pane_title},#{@agent_title_key}}}" {
    run-shell -b "$HOME/.local/bin/agent-tmux-status title #{pane_id}"
  }
}

# Other windows: "<program>:<dir>" (program first, so a cut name still says what
# runs); a shell shows just its directory, home is "~"
# Claude Code names its process after its version (2.1.278): show ✳ for a session
# that has not reported through a hook yet.
set -g automatic-rename-format "#{?pane_in_mode,[tmux],#{?#{m/r:^[0-9]+[.][0-9]+[.][0-9]+$,#{pane_current_command}},✳ #{b:pane_current_path},#{?#{m/r:^-?(fish|zsh|bash|sh)$,#{pane_current_command}},#{?#{==:#{pane_current_path},$HOME},~,#{=/12/…:#{b:pane_current_path}}},#{pane_current_command}#{?#{==:#{pane_current_path},$HOME},,:#{b:pane_current_path}}}}}"

# Visiting a window marks its finished agent as seen (✓ -> bare name)
set-hook -g session-window-changed[42] 'run-shell -b "$HOME/.local/bin/agent-tmux-status seen #{window_id}"'
set-hook -g client-session-changed[42] 'run-shell -b "$HOME/.local/bin/agent-tmux-status seen #{window_id}"'
set-hook -g pane-focus-in[42] 'run-shell -b "$HOME/.local/bin/agent-tmux-status seen #{window_id}"'

# Separator styling
set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_connect_separator "yes"

# Custom module icons
set -g @catppuccin_host_icon " 󰒋 "
set -g @catppuccin_session_icon "  "

# Initialize TMUX plugin manager (loads catppuccin)
run '~/.tmux/plugins/tpm/tpm'

# Status bar (must be set AFTER catppuccin loads)
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_host}"
set -ag status-right "#{E:@catppuccin_status_session}"

# Remove gaps between window tabs
set -g window-status-separator ""
